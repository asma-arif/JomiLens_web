<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jomilens - Interactive GPS Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="JomiLens Logo" class="brand-logo-img">
      <div class="brand-text">
        <h1>JomiLens</h1>
        <p>"Know the Land, Before You Buy."</p>
      </div>
    </a>
    <div class="nav-links">
      <a href="result.html">Back to Details</a>
      <button class="lang-switch" id="langBtn" onclick="toggleLang()">English / বাংলা</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="card-title">🗺️ Interactive GPS Boundary Mapping</h2>
      <p style="color: var(--text-muted); margin-bottom: 1rem;" id="mapSubTitle">Rendering Geo-coordinates for selected plot...</p>
      <div id="map"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 Jomilens - "Know the Land, Before You Buy."</p>
  </footer>

  <script src="script.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      let plotId = localStorage.getItem('selectedPlotId') || 'PLOT-102';
      let data = mockDatabase[plotId] || mockDatabase['PLOT-102'];

      document.getElementById('mapSubTitle').innerText = `Plot Boundary Map for ${data.plotId} (${data.mouza})`;

      const map = L.map('map').setView(data.coords, 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      const marker = L.marker(data.coords).addTo(map);
      marker.bindPopup(`<b>${data.plotId}</b><br>${data.mouza}<br>Status: <b>${data.riskLevel}</b>`).openPopup();

      const lat = data.coords[0];
      const lng = data.coords[1];
      const polygonCoords = [
        [lat + 0.001, lng + 0.001],
        [lat + 0.001, lng - 0.001],
        [lat - 0.001, lng - 0.001],
        [lat - 0.001, lng + 0.001]
      ];

      const polyColor = data.riskLevel === 'SAFE' ? '#22C55E' : (data.riskLevel === 'MEDIUM' ? '#EAB308' : '#EF4444');

      L.polygon(polygonCoords, {
        color: polyColor,
        fillColor: polyColor,
        fillOpacity: 0.4
      }).addTo(map);
    });
  </script>
</body>
</html>
